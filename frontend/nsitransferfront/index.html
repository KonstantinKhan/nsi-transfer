<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НСИ Трансфер</title>
    <script>
      window.appReady = fetch('/config.json')
        .then(r => r.json())
        .then(config => { window.__APP_CONFIG__ = config })
        .catch(() => { window.__APP_CONFIG__ = {} })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      window.appReady.then(() => { import('/src/main.ts') })
    </script>
  </body>
</html>
