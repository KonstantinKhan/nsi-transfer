server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback: vue-router в режиме history требует отдачу index.html на любой путь
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование собранных ассетов (имена с хэшем, содержимое неизменяемо)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
